<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>首都戦記 3D</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game-container" aria-label="首都戦記3D"></div>

  <div class="overlay-ui">
    <div id="status-panel" class="status-panel">
      <div class="stat-row"><span class="stat-label">HP</span><div class="stat-bar"><div id="bar-hp" class="stat-fill hp"></div></div><span id="val-hp" class="stat-val">100</span></div>
      <div class="stat-row"><span class="stat-label">スタミナ</span><div class="stat-bar"><div id="bar-stamina" class="stat-fill stamina"></div></div><span id="val-stamina" class="stat-val">100</span></div>
      <div class="stat-row"><span class="stat-label">元気度</span><div class="stat-bar"><div id="bar-genki" class="stat-fill genki"></div></div><span id="val-genki" class="stat-val">100</span></div>
    </div>

    <button id="map-toggle" class="map-toggle" type="button">2D地図</button>

    <div id="joystick-move" class="joystick joystick-left" aria-label="移動スティック">
      <div class="joystick-base">
        <div id="joystick-move-knob" class="joystick-knob"></div>
      </div>
    </div>

    <div id="joystick-look" class="joystick joystick-right" aria-label="視点スティック">
      <div class="joystick-base">
        <div id="joystick-look-knob" class="joystick-knob"></div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="btn-shoot" class="action-btn shoot" type="button">撃つ</button>
      <button id="btn-jump" class="action-btn jump" type="button">ジャンプ</button>
    </div>

    <div class="minimap-wrap">
      <div class="minimap-label" id="minimap-label">-</div>
      <canvas id="minimap" width="220" height="220"></canvas>
    </div>

    <div id="bigmap" class="bigmap hidden">
      <div class="bigmap-head"><span>2D地図</span><button id="bigmap-close" type="button">閉じる</button></div>
      <canvas id="bigmap-canvas" width="520" height="520"></canvas>
    </div>

    <div id="hp-tags" class="hp-tags"></div>
  </div>

  <div id="char-select" class="char-select">
    <div class="char-card">
      <div class="char-header">
        <div>
          <div class="char-screen-brand">SHUTO BATTLE // 首都戦記</div>
          <h2>キャラクター選択</h2>
        </div>
        <div id="stage-badge" class="stage-badge">STAGE: 新宿駅周辺 1/1</div>
      </div>
      <div class="char-layout">
        <div class="char-left">
          <div id="char-options" class="char-options"></div>
          <div class="battle-settings">
            <div class="area-select-row">
              <span class="area-label">エリア選択:</span>
              <div id="area-options" class="area-options">
                <button type="button" class="area-btn selected" data-area="shinjuku">新宿</button>
                <button type="button" class="area-btn" data-area="machida">町田</button>
              </div>
            </div>
            <label class="enemy-count-label">
              <span>敵CPU数: <strong id="enemy-count-val">20</strong>体</span>
              <input id="enemy-count" type="range" min="3" max="99" value="20">
            </label>
            <p class="char-note">※ エリア面積は敵数に合わせて自動調整（最低半径200m）</p>
          </div>
        </div>
        <div class="char-right">
          <div id="char-preview" class="char-preview"></div>
          <div id="char-stats" class="char-stats"></div>
        </div>
      </div>
      <button id="start-game" class="start-btn" type="button">出撃する — BATTLE START</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
