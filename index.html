<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>首都戦記 3D</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game-container" aria-label="首都戦記3D"></div>

  <div class="overlay-ui">
    <div id="joystick-move" class="joystick joystick-left" aria-label="移動スティック">
      <div class="joystick-base">
        <div id="joystick-move-knob" class="joystick-knob"></div>
      </div>
    </div>

    <div id="joystick-look" class="joystick joystick-right" aria-label="視点スティック">
      <div class="joystick-base">
        <div id="joystick-look-knob" class="joystick-knob"></div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="btn-shoot" class="action-btn shoot" type="button">撃つ</button>
      <button id="btn-jump" class="action-btn jump" type="button">ジャンプ</button>
    </div>

    <div class="minimap-wrap">
      <div class="minimap-label" id="minimap-label">-</div>
      <canvas id="minimap" width="220" height="220"></canvas>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
